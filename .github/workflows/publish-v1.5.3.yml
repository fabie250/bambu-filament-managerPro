name: Publish v1.5.3 Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[publish-v1.5.3]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.3
          name: v1.5.3 合并更新公告（自 v1.4.2）
          body_path: 更新公告_v1.5.3.md
          draft: false
          prerelease: false
          make_latest: true
