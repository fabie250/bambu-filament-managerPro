name: Build Windows Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-v1.5.4]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install customtkinter pillow pyinstaller pyinstxtractor-ng

      - name: Sync v1.5.4 source files
        shell: bash
        env:
          SYNC_ZIP_URL: https://aka.doubaocdn.com/s/lR0QsXkZlj
        run: |
          curl -L --fail --retry 3 -o sync.zip "$SYNC_ZIP_URL"
          python -m zipfile -e sync.zip .
          rm -f sync.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "source files already up to date"
          else
            git commit -m "release: v1.5.4"
            git push origin HEAD:main
          fi

      - name: Recover MiSans fonts from v1.5.3 installer
        shell: bash
        run: |
          curl -L --fail --retry 3 -o SiGuan_1.5.3.exe \
            "https://github.com/fabie250/bambu-filament-managerPro/releases/download/v1.5.3/SiGuan_1.5.3.exe"
          pyinstxtractor-ng SiGuan_1.5.3.exe
          test -f SiGuan_1.5.3.exe_extracted/MiSans-Regular.ttf
          test -f SiGuan_1.5.3.exe_extracted/MiSans-Bold.ttf
          cp SiGuan_1.5.3.exe_extracted/MiSans-Regular.ttf 客户端/
          cp SiGuan_1.5.3.exe_extracted/MiSans-Bold.ttf 客户端/

      - name: Build online installer
        shell: bash
        working-directory: 客户端
        run: |
          python -m PyInstaller SiGuan_1.5.4.spec --clean --noconfirm
          test -f dist/SiGuan_1.5.4.exe

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path

          src = Path('客户端') / 'dist' / 'SiGuan_1.5.4.exe'
          online = Path('SiGuan_1.5.4.exe')
          offline = Path('SiGuan_Offline_1.5.4.exe')
          if not src.is_file():
              raise SystemExit(f'build output not found: {src}')

          shutil.copyfile(src, online)
          shutil.copyfile(src, offline)

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest().upper()

          online_sha = sha(online)
          offline_sha = sha(offline)
          Path('SHA256SUMS.txt').write_text(
              f'{online_sha}  {online.name}\n{offline_sha}  {offline.name}\n',
              encoding='utf-8',
          )

          body = Path('更新公告_v1.5.4.md').read_text(encoding='utf-8')
          body += (
              "\n\n## 安装包校验\n\n"
              "| 产物 | 大小 | SHA256 |\n"
              "|---|---:|---|\n"
              f"| `SiGuan_1.5.4.exe` | {online.stat().st_size} B | `{online_sha}` |\n"
              f"| `SiGuan_Offline_1.5.4.exe` | {offline.stat().st_size} B | `{offline_sha}` |\n\n"
              "> 在线版与离线版使用同一份客户端二进制；离线版通过文件名或 `--offline` 参数启用本地 SQLite 模式。\n"
          )
          Path('release-body.md').write_text(body, encoding='utf-8')
          print(body)
          PY

      - name: Create or update v1.5.4 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.4
          name: v1.5.4 更新公告
          body_path: release-body.md
          files: |
            SiGuan_1.5.4.exe
            SiGuan_Offline_1.5.4.exe
            SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
