name: Edit v1.5.3 Release Body

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  edit:
    if: contains(github.event.head_commit.message, '[edit-v1.5.3-body]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release notes and release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('更新公告_v1.5.3.md')
          s = p.read_text(encoding='utf-8')
          old = '- 安装包体积较大，未直接提交到 Git 仓库；如需发布，请在 GitHub Releases 上传 v1.5.3 的在线版和文件名含 `offline` 的离线版两个 exe，避免离线版更新时选错包。'
          new = '''- 安装包已作为本 Release 附件上传，共两个：
            - 在线版：`SiGuan_1.5.3.exe`（46,200,772 B）
            - 离线版：`SiGuan_Offline_1.5.3.exe`（46,200,772 B）
          - 两个文件 SHA256 均为 `8A18DC139EA070B891106C68DD77DE45E33AD33D7B948674BF348AF19D7AE04E`。
          - 下载地址：`https://github.com/fabie250/bambu-filament-managerPro/releases/download/v1.5.3/SiGuan_1.5.3.exe` / `https://github.com/fabie250/bambu-filament-managerPro/releases/download/v1.5.3/SiGuan_Offline_1.5.3.exe`。
          - 在线版文件名不含 `offline`，离线版文件名含 `offline`；更新时请勿混用。'''
          if old not in s:
              raise SystemExit('old release note not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff -- 更新公告_v1.5.3.md
          gh release edit v1.5.3 --body-file 更新公告_v1.5.3.md --repo fabie250/bambu-filament-managerPro
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 更新公告_v1.5.3.md
          git commit -m 'sync release notes with uploaded assets'
          git push
