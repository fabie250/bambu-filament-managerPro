name: Update v1.5.3 Release Notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-v1.5.3-notes]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release title and body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.3
          name: v1.5.3 更新公告
          body_path: 更新公告_v1.5.3.md
          token: ${{ secrets.GITHUB_TOKEN }}
